[workspace]
resolver = "2"
members = ["crates/sundial-core", "crates/sundial-mps", "crates/sundial-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/noahmitchem/sundial"

[workspace.dependencies]
sundial-core = { path = "crates/sundial-core" }
sundial-mps = { path = "crates/sundial-mps" }
wgpu = "30"
sprs = "0.11"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
futures-channel = "0.3"
flate2 = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
fastrand = "2"
web-time = "1"
