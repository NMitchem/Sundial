[workspace]
resolver = "2"
members = ["crates/sundial-core", "crates/sundial-mps", "crates/sundial-cli", "crates/sundial-web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Floor set by wgpu 30, the strictest dependency. Enforced in CI.
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NMitchem/Sundial"

[workspace.dependencies]
# `version` is required alongside `path` for these to be publishable.
sundial-core = { path = "crates/sundial-core", version = "0.1.0" }
sundial-mps = { path = "crates/sundial-mps", version = "0.1.0" }
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
futures-channel = "0.3"
flate2 = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
fastrand = "2"
web-time = "1"
