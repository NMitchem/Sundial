[package]
name = "sundial-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Linear-programming solver that runs on any GPU as WebGPU compute shaders — restarted PDHG (the PDLP family), with every reported status verified on the CPU in f64."
readme = "README.md"
keywords = ["linear-programming", "optimization", "solver", "gpu", "webgpu"]
categories = ["science", "mathematics", "algorithms"]

[dependencies]
bytemuck.workspace = true
thiserror.workspace = true
fastrand.workspace = true
wgpu.workspace = true
web-time.workspace = true
futures-channel.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

[dev-dependencies]
sundial-mps = { path = "../sundial-mps" }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde.workspace = true
