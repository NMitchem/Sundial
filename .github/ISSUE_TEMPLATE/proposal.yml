name: Proposal / feature request
description: Something Sundial should do that it does not do yet.
labels: ["proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Per [`CONTRIBUTING.md`](../../CONTRIBUTING.md), open an issue **before** writing
        code for anything larger than a bug fix. Several obvious-looking improvements are
        closed experiments with the reasoning written down — double-double accumulation
        and GPU presolve in [`docs/notes/`](../../docs/notes/), the movement-based
        primal-weight update in [`docs/STATUS.md`](../../docs/STATUS.md).
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can you not do today? Concrete beats abstract.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: >
        If it changes solver behavior, say how you would measure that it helped and
        what you would compare against.
    validations: { required: true }
  - type: checkboxes
    id: prior-art
    attributes:
      label: Prior art check
      options:
        - label: I read `docs/STATUS.md` and this is not already recorded as deliberately deferred.
          required: true
  - type: textarea
    id: invariants
    attributes:
      label: Does this touch an invariant?
      description: >
        CONTRIBUTING.md lists commitments a PR may not weaken — certificate honesty, the
        ±1e30 GPU infinity convention, grid-stride kernels, no precision features built on
        error-free transforms, the primal-weight scope, the timing convention. If your
        proposal interacts with any of them, say which and how.
